<!doctype html><meta charset="utf-8"><title>Assignment 4 verification</title><style>body{font:15px system-ui;padding:24px;background:#102035;color:white}pre{white-space:pre-wrap}iframe{width:100%;height:440px}button{padding:12px}</style><h1>Assignment 4 verification</h1><p>Local automated browser integration tests. Speech output and remote AI replies are mocked; no physical microphone or real API key is used.</p><button id="run">Run verification</button><pre id="results">Ready</pre><iframe id="site" src="/index-cmdk.html" title="Website under test"></iframe>
<script>
document.getElementById('run').onclick=async()=>{const out=document.getElementById('results');out.textContent='Running…\n';const w=document.getElementById('site').contentWindow,d=w.document,$=id=>d.getElementById(id);let count=0;
const check=(name,ok)=>{out.textContent+=(ok?'PASS ':'FAIL ')+name+'\n';if(!ok)throw Error(name);count++;};const wait=async fn=>{const end=Date.now()+10000;while(!fn()){if(Date.now()>end)throw Error('Timed out');await new Promise(r=>setTimeout(r,35));}};
const login=async role=>{$('sim-login-role').value=role;$('sim-login-username').value='demo';$('sim-login-password').value='demo';$('btn-sim-login-submit').click();await wait(()=>w.getComputedStyle($('simulated-login-overlay')).display==='none');};const attempt=action=>{$('a4-action').value=action;$('a4-check').click();};
try{await wait(()=>w.Assignment4&&w.routeCommand);const spoken=[];w.speechSynthesis.speak=u=>{spoken.push(u.text);queueMicrotask(()=>u.onend?.());};
await login('user');check('Existing login / Regular User identity and timer',w.Assignment4.role==='user'&&$('session-pill-text').textContent.includes('remaining'));const token=w.currentSessionToken;$('sim-login-role').value='admin';check('Role is bound to session, not editable login selector',w.Assignment4.role==='user'&&w.currentSessionToken===token);
attempt('profile.view');check('Regular User can view demo profile',!$('a4-profile').hidden);$('a4-profile-name').value='Demo Tester';$('a4-profile-save').click();check('Regular User can edit in-memory profile',$('a4-profile-summary').textContent.includes('Demo Tester'));
attempt('users.manage');check('Regular User denied Manage Users',$('a4-users').hidden&&$('a4-decision').textContent.includes('ACCESS DENIED'));attempt('logs.view');check('Regular User denied Security Logs',$('a4-logs').hidden&&$('a4-decision').textContent.includes('ACCESS DENIED'));
check('Grant and denial events use SecurityState',w.SecurityState.activityLog.some(e=>e.source==='RBAC'&&e.message.includes('ACCESS GRANTED'))&&w.SecurityState.activityLog.some(e=>e.source==='RBAC'&&e.message.includes('ACCESS DENIED')));
w.__simulateSessionElapsed(1200);check('Existing expiry invalidates RBAC',!w.Assignment4.valid()&&!w.Assignment4.check('profile.view'));await login('admin');check('Administrator login works',w.Assignment4.role==='admin');attempt('users.manage');check('Administrator can Manage Users',!$('a4-users').hidden&&$('a4-user-list').children.length===3);$('a4-user-list').querySelector('button').click();check('View demo user',$('a4-user-detail').textContent.includes('demo.student'));$('a4-user-list').querySelectorAll('button')[1].click();check('Change demo role without changing active session',$('a4-user-list').firstElementChild.textContent.includes('ADMINISTRATOR')&&w.Assignment4.role==='admin');$('a4-user-list').querySelectorAll('button')[2].click();check('Disable demo account',$('a4-user-list').firstElementChild.textContent.includes('Disabled'));
attempt('logs.view');check('Administrator views existing telemetry',$('a4-log-output').textContent.includes('RBAC'));attempt('content.manage');$('a4-content-text').value='<img src=x onerror=alert(1)> Demo';$('a4-content-save').click();check('Content simulation uses safe text rendering',!$('a4-content').hidden&&$('a4-content-preview').textContent.includes('<img')&&!$('a4-content-preview').querySelector('img'));
const canvas=d.createElement('canvas');canvas.width=64;canvas.height=64;canvas.getContext('2d').fillRect(0,0,64,64);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const file=new w.File([blob],'portrait.png',{type:'image/png'});const dt=new w.DataTransfer();dt.items.add(file);$('a4-photo-file').files=dt.files;$('a4-photo-file').dispatchEvent(new w.Event('change'));await wait(()=>!$('a4-photo').hidden);check('Valid upload and decoded local preview',$('a4-photo').src.startsWith('blob:')&&$('a4-photo').naturalWidth===64);$('a4-generate').click();check('Generate local simulation and workflow stages',w.Assignment4.generated&&$('a4-person-flow').children[1].classList.contains('done'));
d.dispatchEvent(new w.CustomEvent('kean:voice-status',{detail:{state:'listening'}}));check('Shared voice event drives LISTENING',$('a4-avatar-state').textContent==='LISTENING');d.dispatchEvent(new w.CustomEvent('kean:command-start'));check('Command event drives THINKING',$('a4-avatar-state').textContent==='THINKING');d.dispatchEvent(new w.CustomEvent('kean:voice-status',{detail:{state:'speaking'}}));check('Shared voice event drives SPEAKING',$('a4-avatar-state').textContent==='SPEAKING');
$('a4-question').value='tell us about STRIDE and give examples';$('a4-question-form').dispatchEvent(new w.Event('submit',{cancelable:true,bubbles:true}));check('Digital Person typed question uses existing router and local fallback',$('a4-answer-source').textContent==='LOCAL FALLBACK RESPONSE'&&$('a4-answer').textContent.includes('No AI is connected')&&spoken.length>0);await new Promise(r=>setTimeout(r,0));check('Voice completion returns IDLE',$('a4-avatar-state').textContent==='IDLE');check('Question and response workflow stages',$('a4-person-flow').children[3].classList.contains('done')&&$('a4-person-flow').children[4].classList.contains('done'));
check('Reject invalid file type',!(await w.Assignment4.selectPhoto(new w.File(['x'],'bad.svg',{type:'image/svg+xml'}))));check('Reject oversized photo',!(await w.Assignment4.selectPhoto(new w.File([new Uint8Array(5*1024*1024+1)],'big.png',{type:'image/png'}))));check('Reject spoofed image',!(await w.Assignment4.selectPhoto(new w.File(['not png'],'bad.png',{type:'image/png'}))));await w.Assignment4.selectPhoto(file);$('a4-clear').click();check('Clear photo/reset removes preview and generation',$('a4-photo').hidden&&!$('a4-photo').hasAttribute('src')&&!w.Assignment4.generated);
for(const provider of ['gemini','claude']){$('btn-open-connect-ai').click();$('ai-provider-select').value=provider;$('ai-provider-select').dispatchEvent(new w.Event('change'));$('ai-api-key-input').value='DUMMY_TEST_KEY';$('btn-save-ai-key').click();check(provider+' provider controls preserved',w.SecurityState.aiProvider===provider&&w.SecurityState.aiApiKey==='DUMMY_TEST_KEY');}
w.keanGeminiFetch=async()=>({json:async()=>({content:[{type:'text',text:'Mock response for UI provenance verification.'}]})});await w.routeCommand('Explain authentication with examples');check('Live answer source badge (mock response only)',$('a4-answer-source').textContent==='LIVE AI RESPONSE');$('btn-open-connect-ai').click();$('btn-clear-ai-key').click();check('Disconnect retained',w.SecurityState.aiApiKey===null);
d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'k',ctrlKey:true,bubbles:true}));check('Ctrl+K opens existing palette',$('cmdk-dialog').open);$('cmdk-input').value='open stride';$('cmdk-input').dispatchEvent(new w.Event('input',{bubbles:true}));$('cmdk-input').dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));await wait(()=>$('panel-tab-4').classList.contains('active'));check('Palette routes existing navigation',true);$('stride-tier-filter').value='Tier 5';$('stride-tier-filter').dispatchEvent(new w.Event('change'));check('STRIDE tier filter preserved',$('stride-table-body').children.length===1);
let download=false;const nativeClick=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){if(this.download.includes('Assignment2'))download=true;else nativeClick.call(this);};$('stride-export-btn').click();check('Assignment 2 export creates download (intercepted)',download);w.HTMLAnchorElement.prototype.click=nativeClick;
$('generate-passphrase-btn').click();check('AuthGuard generation preserved',$('pwd-input').value.length>10);await w.routeCommand('hype mode');check('Personality mode preserved',w.KeanPersonality.mode==='hype');await w.routeCommand('professional mode');check('Professional switch preserved',w.KeanPersonality.mode==='professional');$('theme-btn-light').click();check('Light theme works',!d.body.classList.contains('dark-mode'));$('theme-btn-dark').click();check('Dark theme works',d.body.classList.contains('dark-mode'));
w.__simulateSessionElapsed(1200);check('Expired administrator cannot mutate or view',!w.Assignment4.check('users.manage')&&!w.Assignment4.check('logs.view')&&!w.Assignment4.check('content.manage'));
d.dispatchEvent(new w.CustomEvent('kean:answer',{detail:{text:'stale response',kind:'live'}}));check('Expired session ignores late AI response',$('a4-answer').textContent==='Session ended. Sign in to continue.');
out.textContent+='\nCOMPLETE: '+count+' checks passed. Mock speech/API/event checks; no live microphone/provider verification.';
}catch(e){out.textContent+='\nFAILED: '+e.message;console.error(e);}};
</script>
