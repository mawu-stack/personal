<!doctype html><html lang="en"><meta charset="utf-8"><title>DDoS Guard checks</title><style>body{font:16px system-ui;background:#101a29;color:#e8f0ff;padding:24px}button{padding:12px}pre{white-space:pre-wrap}iframe{width:100%;height:550px}</style><h1>DDoS Guard browser verification</h1><button id="run">Run checks</button><pre id="out" role="status">Not run.</pre><iframe id="site" src="/index-cmdk.html#tab-7"></iframe><script>
document.getElementById('run').onclick=async()=>{const out=document.getElementById('out'),frame=document.getElementById('site'),w=frame.contentWindow,d=w.document,$=id=>d.getElementById(id);out.textContent='Running…\n';let count=0;const check=(v,m)=>{if(!v)throw Error(m);count++;out.textContent+='PASS '+m+'\n';};const wait=async f=>{const end=Date.now()+8000;while(!f()){if(Date.now()>end)throw Error('Timed out');await new Promise(r=>setTimeout(r,40));}};const prior=w.localStorage.getItem('ddos-guard-history');try{await wait(()=>w.DDoSGuard&&w.Assignment6&&w.A4Auth);w.speechSynthesis.speak=()=>{};$('sim-login-username').value='student';$('sim-login-password').value='StudentDemo!2026';await w.handleSimulatedLoginSubmit();check($('panel-tab-7').classList.contains('active'),'Tab 7 opens DDoS Guard');check(!d.getElementById('pg-url-form')&&!d.getElementById('phishguard-controller'),'Old phishing scanner and controller removed');check($('dg-model-table').rows.length===2,'Two actual model results shown');check($('dg-stats').textContent.includes('185,117'),'Actual held-out row count displayed');check($('dg-classes').textContent.includes('Benign'),'Actual class chart populated');check($('dg-roc').querySelectorAll('polyline').length===4,'Two actual ROC curves and chance reference rendered');$('dg-feature').value='Flow Duration';$('dg-feature').dispatchEvent(new w.Event('change'));check($('dg-hist').querySelectorAll('.dg-hist-row').length===9,'Feature selector renders nine log bins');$('dg-metric').value='recall';$('dg-metric').dispatchEvent(new w.Event('change'));check($('dg-model-bars').textContent.includes('86.51%'),'Metric selector updates real recall');
const r=w.DDoSGuard.results;for(const index of [0,5,15]){$('dg-example').value=String(index);$('dg-example').dispatchEvent(new w.Event('change'));$('dg-form').dispatchEvent(new w.Event('submit',{cancelable:true}));check($('dg-verdict').textContent.startsWith(r.examples[index].prediction?'Attack-like':'Benign-like'),'Actual tree prediction matches held-out record '+index);check($('dg-reasons').children.length>0,'Decision-path explanation rendered '+index);}
$('dg-save').checked=true;$('dg-form').dispatchEvent(new w.Event('submit',{cancelable:true}));check(JSON.parse(w.localStorage.getItem('ddos-guard-history')).length>0,'Opt-in flow history saved');const revisit=[...$('dg-history-list').querySelectorAll('button')].find(x=>x.textContent==='Revisit');revisit.click();check($('dg-verdict').textContent.includes('local decision tree'),'History revisit restores result');$('dg-clear').click();check($('dg-history-list').textContent.includes('No saved'),'History clear works');$('dg-save').checked=false;$('dg-value-0').value='999';$('dg-form').dispatchEvent(new w.Event('submit',{cancelable:true}));check($('dg-verdict').textContent.includes('protocol'),'Invalid protocol receives helpful error');
let download;const original=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){download={name:this.download,href:this.href};};try{$('dg-export').click();check(download.name==='ddos-guard-results.json'&&download.href.startsWith('blob:'),'Research export creates real JSON blob');$('a6-download-results').click();check(download.name==='assignment6-results.json','Assignment 6 exports replacement DDoS results');}finally{w.HTMLAnchorElement.prototype.click=original;}
w.routeCommand('open ddos guard');await wait(()=>$('panel-tab-7').classList.contains('active'));check($('panel-tab-7').classList.contains('active'),'Shared command router opens DDoS Guard');w.switchTab('tab-9');check($('a6-metric-rows').rows.length===2&&$('a6-results-status').textContent.includes('DDoS'),'Assignment 6 now shows DDoS research');const xss=w.Assignment6.runTests();check(xss.passed===10&&xss.failed===0,'Ten XSS control checks preserved');for(const i of [1,2,3,4,5,6,8]){w.switchTab('tab-'+i);await wait(()=>$('panel-tab-'+i).classList.contains('active'));check($('panel-tab-'+i).classList.contains('active'),'Existing tab '+i+' accessible');}w.switchTab('tab-7');frame.style.width='390px';await wait(()=>w.innerWidth<=400);check(w.getComputedStyle($('dg-inputs')).gridTemplateColumns.split(' ').length===1,'Mobile input grid collapses to one column');frame.style.width='100%';out.textContent+='COMPLETE: '+count+' browser checks passed. Microphone and paid providers not exercised.';}catch(e){out.textContent+='FAIL '+e.message;}finally{if(prior===null)w.localStorage.removeItem('ddos-guard-history');else w.localStorage.setItem('ddos-guard-history',prior);}};
</script></html>
