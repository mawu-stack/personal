<!doctype html><html lang="en"><meta charset="utf-8"><title>Reduced-motion branch checks</title><style>body{font:15px system-ui;background:#0b0c10;color:#f2f0e9;padding:24px}button{padding:12px}iframe{width:100%;height:600px}pre{white-space:pre-wrap}</style><h1>Reduced-motion branch checks</h1><p>Injects a reduced-motion media-query mock into an isolated copy of the real homepage. This tests application branches, not an OS setting or physical device.</p><button id="run">Run reduced-motion checks</button><pre id="out" role="status">Not run.</pre><iframe id="site" title="Reduced-motion application test"></iframe><script>
document.getElementById('run').onclick=async()=>{const out=document.getElementById('out'),f=document.getElementById('site');out.textContent='Running…\n';try{const source=await(await fetch('index.html')).text();const patch='<base href="./"><script>const nativeMedia=window.matchMedia.bind(window);window.matchMedia=query=>{if(!query.includes("prefers-reduced-motion"))return nativeMedia(query);const events=new EventTarget();return {matches:true,media:query,addEventListener:events.addEventListener.bind(events),removeEventListener:events.removeEventListener.bind(events)};};<'+ '/script>';const ready=new Promise(r=>f.onload=r);f.srcdoc=source.replace('<head>','<head>'+patch.replace('href="./"','href="/personal/kean-v2/"'));await ready;await new Promise(r=>setTimeout(r,1800));const d=f.contentDocument;let n=0;const check=(ok,name)=>{if(!ok)throw Error(name);n++;out.textContent+='PASS '+name+'\n';};check(d.getElementById('motion-toggle').disabled&&d.getElementById('motion-toggle').textContent.includes('Reduced motion'),'Reduced-motion branch disables continuous motion control');check(![...d.scripts].some(s=>s.src.includes('vendor/gsap')||s.src.endsWith('field-motion.js')),'Optional animation bundles are not loaded');d.querySelector('[data-project="4"]').click();check(d.querySelector('.project-canvas').getAttribute('aria-label').includes('Traffic')&&d.getElementById('field-link').href.endsWith('#tab-7'),'Static scenes and project navigation still work');out.textContent+='COMPLETE: '+n+' reduced-motion branch checks passed. Actual CSS media preference / physical device not simulated.';}catch(e){out.textContent+='FAIL '+e.message;}};
</script></html>
