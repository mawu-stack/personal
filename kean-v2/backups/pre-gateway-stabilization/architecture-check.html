<!doctype html><html lang="en"><meta charset="utf-8"><title>Architecture integration verification</title><h1>Architecture integration verification</h1><pre id="results">Running…</pre><iframe title="Redesigned architecture" id="test" src="workbench.html#tab-5" style="width:1200px;height:900px"></iframe><script>
const lines=[];function check(ok,msg){lines.push((ok?'PASS':'FAIL')+' '+msg);document.getElementById('results').textContent=lines.join('\n');if(!ok)throw Error(msg);}
const frame=document.getElementById('test');frame.onload=async()=>{try{const d=frame.contentDocument,w=frame.contentWindow;await new Promise(r=>setTimeout(r,1500));const baseline=await(await fetch('legacy/index-cmdk.html')).text(),old=new DOMParser().parseFromString(baseline,'text/html');
for(const i of [5,6]){const a=d.querySelector('#panel-tab-'+i).cloneNode(true);a.querySelector('.arch-explorer')?.remove();check(a.textContent===old.querySelector('#panel-tab-'+i).textContent,'Tab '+i+' original content exact');}
const buttons=[...d.querySelectorAll('.arch-node')],articles=[...d.querySelectorAll('.a3-grid article')];check(buttons.length===9,'Nine accessible component buttons');
buttons.forEach((b,i)=>{b.click();check(d.querySelector('.arch-inspector h4').textContent===articles[i].querySelector('h4').textContent&&d.querySelector('.arch-inspector>p:not(.arch-kicker)').textContent===articles[i].querySelector('p').textContent,'Inspector uses verbatim '+b.textContent);});
const next=d.querySelector('.arch-toolbar button');for(let i=0;i<4;i++)next.click();check(d.querySelectorAll('.arch-traversed').length===4,'Four boundary request walkthrough');d.querySelectorAll('.arch-toolbar button')[1].click();check(!d.querySelector('.arch-traversed'),'Reset clears path');
check(d.querySelector('#panel-tab-5').classList.contains('active'),'Direct #tab-5 opens correct panel');check(d.querySelector('.v2-return').getAttribute('href')==='index.html','Homepage return preserved');
d.body.classList.add('wb-light');check(w.getComputedStyle(d.body).getPropertyValue('--lab-accent').trim()==='#216044','Accessible light palette selected');d.body.classList.remove('wb-light');
frame.style.width='390px';await new Promise(r=>setTimeout(r,200));check(d.querySelector('.arch-layout').getBoundingClientRect().width<=390,'390px diagram fits viewport');check(w.getComputedStyle(d.querySelector('.arch-layout')).gridTemplateColumns.split(' ').length===1,'Mobile inspector stacks');
d.querySelectorAll('.arch-toolbar button')[2].click();check(d.activeElement.id==='a3-flow-title','Original assignment navigation focuses original heading');check(d.querySelector('.a3-detail').open,'Complete original walkthrough remains available');
check(buttons.every(b=>b.tagName==='BUTTON'&&b.getAttribute('aria-controls')==='architecture-inspector'),'Native keyboard controls and inspector association');
lines.push('COMPLETE: '+lines.length+' checks passed. No live provider or microphone test.');document.getElementById('results').textContent=lines.join('\n');}catch(e){lines.push('ERROR '+e.message);document.getElementById('results').textContent=lines.join('\n');}};
</script></html>
