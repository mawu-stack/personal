<!doctype html><html lang="en"><meta charset="utf-8"><title>Phase 2 parity checks</title><style>body{background:#0b0c10;color:#f2f0e9;font:14px system-ui;padding:24px}button{padding:12px}pre{white-space:pre-wrap}.frames{display:flex;gap:12px;overflow:auto}iframe{width:1100px;min-width:1100px;height:600px}</style><h1>Original ↔ Phase 2 migration parity</h1><p>Uses the actual frozen and derived applications. No provider keys or real microphone access.</p><button id="run">Run parity checks</button><pre id="out" role="status">Not run.</pre><div class="frames"><iframe id="old" title="Frozen original" src="legacy/index-cmdk.html#tab-1"></iframe><iframe id="new" title="Redesign workspace" src="workbench.html#tab-1"></iframe></div><script>
document.getElementById('run').onclick=async()=>{const out=document.getElementById('out');out.textContent='Running…\n';let count=0;const assert=(ok,name)=>{if(!ok)throw Error(name);count++;out.textContent+='PASS '+name+'\n';};const wait=async fn=>{const end=Date.now()+15000;while(!fn()){if(Date.now()>end)throw Error('Timed out waiting for application');await new Promise(r=>setTimeout(r,40));}};try{const frames=['old','new'].map(id=>document.getElementById(id)),windows=frames.map(f=>f.contentWindow);await wait(()=>windows.every(w=>w.A4Auth&&w.SecurityState&&w.sentryCalculateTTC&&w.zxcvbn));const $=(w,id)=>w.document.getElementById(id);for(const w of windows){w.speechSynthesis.speak=()=>{};$(w,'sim-login-username').value='student';$(w,'sim-login-password').value='StudentDemo!2026';await w.handleSimulatedLoginSubmit();await wait(()=>w.getComputedStyle($(w,'simulated-login-overlay')).display==='none');}assert(windows.every(w=>w.currentSession?.role==='user'),'Original credential login and user role in both runtimes');
for(const value of ['password','Tr0ub4dor&3','correct-horse-battery-staple','Cyb3r$ecure!2026#']){for(const w of windows){$(w,'pwd-input').value=value;$(w,'pwd-input').dispatchEvent(new w.Event('input',{bubbles:true}));}await new Promise(r=>setTimeout(r,550));for(const id of ['entropy-bits','real-entropy-bits','zxcvbn-score-desc'])assert($(windows[0],id).textContent===$(windows[1],id).textContent,'AuthGuard '+id+' parity: '+value);}
for(const w of windows)$(w,'toggle-report-btn').click();await wait(()=>$(windows[0],'audit-report-text').textContent.length>100&&$(windows[1],'audit-report-text').textContent.length>100);const normalize=s=>s.replace(/\d{4}-\d\d-\d\dT[\d:.]+Z/g,'TIME').replace(/Generated[^\n]*/gi,'GENERATED');assert(normalize($(windows[0],'audit-report-text').textContent)===normalize($(windows[1],'audit-report-text').textContent),'Full audit receipt parity (timestamp normalized)');
for(const w of windows){$(w,'toggle-pwd-visibility-btn').click();}assert(windows.every(w=>$(w,'pwd-input').type==='text'),'Password visibility control retained');for(const w of windows)$(w,'clear-pwd-btn').click();assert(windows.every(w=>$(w,'pwd-input').value===''),'Password clear retained');for(const w of windows)$(w,'generate-passphrase-btn').click();assert(windows.every(w=>$(w,'pwd-input').value.length>=15),'Passphrase generation remains functional (random outputs not compared)');
const profiles=[{waf:true,rateLimit:true,pbkdf2:true},{waf:false,rateLimit:false,pbkdf2:false},{waf:true,rateLimit:false,pbkdf2:true}];for(const entropy of [32,41,64,128])for(const defenses of profiles)assert(JSON.stringify(windows[0].sentryCalculateTTC(entropy,defenses))===JSON.stringify(windows[1].sentryCalculateTTC(entropy,defenses)),'TTC exact parity '+entropy+' bits / '+JSON.stringify(defenses));
for(const w of windows)w.switchTab('tab-2');await wait(()=>windows.every(w=>$(w,'panel-tab-2').classList.contains('active')));for(let i=1;i<=8;i++){for(const w of windows){$(w,'btn-clear-telemetry').click();if(i===3){$(w,'toggle-paramsql').checked=false;$(w,'toggle-paramsql').dispatchEvent(new w.Event('change'));}const button=$(w,'btn-attack-'+i);button.disabled=false;button.click();}await new Promise(r=>setTimeout(r,350));const telemetry=w=>$(w,'telemetry-terminal-body').textContent.replace(/\[\d{1,2}:\d{2}:\d{2}(?: [AP]M)?\]/g,'[TIME]');const a=telemetry(windows[0]),b=telemetry(windows[1]);assert(a.includes('VECTOR '+i),'Vector '+i+' emits its actual telemetry');assert(a===b,'Vector '+i+' telemetry matches original (timestamp normalized)');}
for(const w of windows){$(w,'toggle-paramsql').checked=true;$(w,'toggle-paramsql').dispatchEvent(new w.Event('change'));}assert(windows.every(w=>$(w,'btn-attack-3').disabled),'Parameterized SQL control still neutralizes SQLi button');
for(let i=1;i<=9;i++){for(const w of windows)w.switchTab('tab-'+i);await wait(()=>windows.every(w=>$(w,'panel-tab-'+i).classList.contains('active')));assert(windows.every(w=>$(w,'panel-tab-'+i).classList.contains('active')),'Retained tab '+i+' navigates');}for(const w of windows)w.routeCommand('show security logs');assert(windows.every(w=>$(w,'a4-decision').textContent.includes('Authorized: no')),'Shared route still enforces Regular User denial');for(const w of windows){w.document.dispatchEvent(new w.KeyboardEvent('keydown',{key:'k',ctrlKey:true,bubbles:true}));}assert(windows.every(w=>$(w,'cmdk-dialog').open),'Existing Ctrl+K palette opens in both');for(const w of windows)$(w,'cmdk-dialog').close();
const w=windows[1];w.switchTab('tab-1');frames[1].style.width='390px';frames[1].style.minWidth='390px';await wait(()=>w.innerWidth===390);assert(w.document.documentElement.scrollWidth<=w.innerWidth+1,'Migrated AuthGuard fits 390px without page overflow');assert(w.getComputedStyle(w.document.querySelector('.tabs-nav-bar')).position!=='fixed','Migrated navigation becomes mobile grid');assert($(w,'tab-btn-9').getBoundingClientRect().width>30,'All nine mobile destinations available');assert(w.document.querySelector('.v2-return').getAttribute('href')==='index.html','Return-to-portfolio link available');frames[1].style.width='1100px';frames[1].style.minWidth='1100px';out.textContent+='COMPLETE: '+count+' parity/smoke checks passed. Vector checks verify controls and feedback, not every branch. Physical voice and paid provider calls not tested.';}catch(e){out.textContent+='FAIL '+e.message;}};
</script></html>
