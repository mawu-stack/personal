<!doctype html><html lang="en"><meta charset="utf-8"><title>Lab 05 topology QA</title><h1>Lab 05 topology QA</h1><button id="view-mobile">Show mobile diagram</button><button id="view-desktop">Show desktop diagram</button><pre id="out">Running…</pre><iframe id="app" title="Proposed architecture under test" src="workbench.html#tab-5" style="width:1440px;height:1000px"></iframe><script>
const f=document.getElementById('app'),out=document.getElementById('out'),pause=ms=>new Promise(r=>setTimeout(r,ms));let count=0;const wait=async(fn,ms=9000)=>{const end=Date.now()+ms;while(!fn()){if(Date.now()>end)throw Error('Timed out');await pause(30);}},check=(ok,msg)=>{if(!ok)throw Error(msg);out.textContent+='PASS '+msg+'\n';count++;};
f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument,$=id=>d.getElementById(id),errors=[];w.addEventListener('error',e=>errors.push(e.message));try{out.textContent='';await wait(()=>$('architecture-graph')?.cytoscape);const stage=$('architecture-explorer'),cy=$('architecture-graph').cytoscape;w.speechSynthesis.speak=()=>{};$('sim-login-username').value='student';$('sim-login-password').value='StudentDemo!2026';await w.handleSimulatedLoginSubmit();await wait(()=>!$('workbench-content').inert);check(w.cytoscape.version==='3.34.4','Runtime library version is 3.34.4');check(stage.dataset.engine==='cytoscape-3.34.4','Pinned local Cytoscape engine actually initialized');check(cy.nodes(':childless').length===9,'Nine component graph nodes');check(cy.nodes(':parent').length===5,'Five labeled compound trust zones');check(cy.edges().length===16,'Sixteen directed request and security-control edges');check(d.querySelectorAll('.arch-toolbar button').length===5,'Single set of existing next/reset/read plus previous/play controls');
const baseline=new DOMParser().parseFromString(await(await fetch('legacy/index-cmdk.html')).text(),'text/html');await wait(()=>$('panel-tab-5').querySelector('.a3-intro h2').textContent===baseline.querySelector('#panel-tab-5 .a3-intro h2').textContent);for(const i of [5,6]){const clone=$('panel-tab-'+i).cloneNode(true);clone.querySelector('.research-guide')?.remove();clone.querySelector('.arch-explorer')?.remove();const research=clone.querySelector('#architecture-research');if(research){research.querySelector(':scope>summary').remove();research.replaceWith(...research.childNodes);}check(clone.textContent===baseline.getElementById('panel-tab-'+i).textContent,'Original Tab '+i+' text preserved exactly');}
const articles=[...$('architecture-research').querySelectorAll('.a3-grid article')];for(const node of cy.nodes(':childless')){node.emit('tap');const i=node.data('component');check($('architecture-inspector').querySelector('h4').textContent===articles[i].querySelector('h4').textContent,'Graph node '+node.id()+' selects original explanation');check($('architecture-component').value===String(i),'Graph selection synchronizes native selector '+node.id());}
const btn=name=>[...stage.querySelectorAll('button')].find(b=>b.textContent===name);btn('Reset path').click();for(let i=1;i<=13;i++){btn('Next request step →').click();check(stage.dataset.requestStep===String(i)&&cy.edges('.route-current').length===1,'Request step '+i+' highlights one current edge');check(cy.nodes(':selected').length===1,'Request step '+i+' selects its component');}check(cy.edges('.route-past').length===12&&stage.dataset.selected==='browser','Complete route returns to browser with prior edges highlighted');btn('← Previous step').click();check(stage.dataset.requestStep==='12','Previous request step works');btn('Reset path').click();check(cy.edges('.route-current,.route-past').length===0&&stage.dataset.requestStep==='0','Reset clears request path');
let before=cy.zoom();btn('Zoom in +').click();check(cy.zoom()>before,'Zoom in changes actual graph viewport');btn('Zoom out −').click();check(Math.abs(cy.zoom()-before)<.00001,'Zoom out reverses zoom');for(const [name,axis,sign]of [['Pan left','x',1],['Pan right','x',-1],['Pan up','y',1],['Pan down','y',-1]]){const old=cy.pan()[axis];btn(name).click();check(Math.sign(cy.pan()[axis]-old)===sign,name+' changes actual viewport');}btn('Fit diagram').click();const box=cy.elements().renderedBoundingBox(),size=$('architecture-graph').getBoundingClientRect();check(box.x1>=-2&&box.y1>=-2&&box.x2<=size.width+2&&box.y2<=size.height+2,'Fit includes complete graph');
$('architecture-component').value='6';$('architecture-component').dispatchEvent(new w.Event('change'));check(stage.dataset.selected==='encryption','Native selector reaches encryption boundaries');const graph=$('architecture-graph');graph.focus();graph.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}));check(stage.dataset.selected==='session','Graph arrow key selects next component');graph.dispatchEvent(new w.KeyboardEvent('keydown',{key:'0',bubbles:true,cancelable:true}));check(graph===d.activeElement,'Keyboard fit retains graph focus');
btn('Play request').click();await pause(1550);check(Number(stage.dataset.requestStep)>=2&&btn('Pause request').getAttribute('aria-pressed')==='true','Playback advances edges and has pause state');btn('Pause request').click();const paused=stage.dataset.requestStep;await pause(1500);check(stage.dataset.requestStep===paused,'Pause stops request progression');
for(const theme of ['light','dark']){$('theme-btn-'+theme).click();await pause(80);check(cy.$id('browser').style('color')===(theme==='light'?'rgb(36,57,45)':'rgb(238,244,236)'),theme+' theme updates graph node palette');}
for(const width of [1440,1024,768,390]){f.style.width=width+'px';await pause(180);btn('Fit diagram').click();check(d.documentElement.scrollWidth<=w.innerWidth+2,width+'px page has no horizontal overflow');const b=cy.elements().renderedBoundingBox(),s=graph.getBoundingClientRect();check(b.x1>=-2&&b.y1>=-2&&b.x2<=s.width+2&&b.y2<=s.height+2,width+'px complete diagram fits');if(width===390)check(w.getComputedStyle($('kean-presentation-bar')).position==='static','Mobile assistant does not overlay graph');}
btn('Read the complete assignment ↓').click();check($('architecture-research').open&&d.activeElement.id==='a3-flow-title','Existing assignment action opens research and focuses original heading');check($('architecture-research').querySelectorAll('.a3-grid article').length===9,'All original nine component articles accessible');w.switchTab('tab-6');await pause(40);check(w.location.hash==='#tab-6','Original assignment navigation still works');w.switchTab('tab-5');await wait(panelVisible);check(panelVisible(),'Return to graph lab works');check(errors.length===0,'No runtime errors during interactions');btn('Reset path').click();out.textContent+='COMPLETE: '+count+' checks passed. Node event tests use the actual rendered Cytoscape instance. Physical pointer test is recorded separately.';
function panelVisible(){return $('panel-tab-5').classList.contains('active')&&graph.getBoundingClientRect().width>0;}
}catch(e){out.textContent+='FAIL '+e.message;}};
function show(width){f.style.width=width+'px';out.hidden=true;document.querySelector('h1').hidden=true;f.style.height='1040px';f.contentDocument.getElementById('architecture-graph').scrollIntoView({block:'start',behavior:'instant'});f.scrollIntoView({block:'start',behavior:'instant'});}
document.getElementById('view-mobile').onclick=()=>show(390);document.getElementById('view-desktop').onclick=()=>show(1440);
</script></html>
