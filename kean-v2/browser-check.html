<!doctype html><html lang="en"><meta charset="utf-8"><title>K.E.A.N. 2.0 prototype checks</title><style>body{font:15px system-ui;padding:25px;background:#0b0c10;color:#f2f0e9}button{padding:14px}pre{white-space:pre-wrap}iframe{width:1280px;max-width:none;height:700px;border:1px solid #444}.viewport{max-width:100%;overflow:auto}</style><h1>Prototype browser checks</h1><p>Checks the separate presentation prototype. Does not certify the unmigrated tools or paid providers.</p><button id="run">Run prototype checks</button><pre role="status" id="out">Not run.</pre><div class="viewport"><iframe id="site" title="Homepage under test" src="/personal/kean-v2/"></iframe></div><script>
const frame=document.getElementById('site'),out=document.getElementById('out');document.getElementById('run').onclick=async()=>{out.textContent='Running…\n';let count=0;const check=(ok,name)=>{if(!ok)throw Error(name);count++;out.textContent+='PASS '+name+'\n';};const wait=async f=>{let end=Date.now()+7000;while(!f()){if(Date.now()>end)throw Error('Timed out');await new Promise(r=>setTimeout(r,30));}};try{const w=frame.contentWindow,d=w.document,$=id=>d.getElementById(id);await wait(()=>d.querySelector('.result-row'));check(d.title.includes('K.E.A.N.'),'Homepage loads under /personal/kean-v2/');check(d.querySelectorAll('h1').length===1&&d.querySelectorAll('main').length===1,'One main landmark and H1');check(Boolean($('field-exhibit').querySelector('canvas')),'Distinct 3D canvas explorer loads');check(d.querySelectorAll('.orbit-controls button').length===5,'Five project selectors');const scenes=new Set();for(let i=0;i<5;i++){d.querySelector('[data-project="'+i+'"]').click();const c=d.querySelector('.project-canvas');scenes.add(c.toDataURL());check(c.getAttribute('aria-label').length>20,'Scene '+i+' has accessible explanation');}check(scenes.size===5,'All five project categories render distinct visualizations');d.querySelector('[data-project="4"]').click();check($('field-title').textContent==='DDoS Guard AI'&&$('field-link').href.endsWith('#tab-7'),'Orbit selection updates title and real destination');check(d.querySelector('[data-project="4"]').getAttribute('aria-pressed')==='true','Orbit selection announced with pressed state');d.querySelector('[data-project="0"]').click();check($('field-description').textContent.includes('Password entropy'),'Project description updates');check(d.querySelectorAll('.result-row').length===2&&$('result-bars').textContent.includes('92.72%'),'Real DDoS F1 bars rendered');check($('test-count').textContent==='185,117','Real test count displayed');check([...d.querySelectorAll('a')].filter(a=>a.getAttribute('href')?.startsWith('workbench.html')).every(a=>a.href.startsWith(location.origin+'/personal/kean-v2/workbench.html')),'Legacy links preserve GitHub Pages repository prefix');
const opener=d.querySelector('[data-launch]');opener.click();check($('explorer').open,'Explorer opens as native modal');check(d.activeElement===$('project-search'),'Focus moves to search');check($('project-results').children.length===9,'All nine original destinations listed');$('project-search').value='password';$('project-search').dispatchEvent(new w.Event('input'));check($('project-results').children.length===1&&$('project-results').textContent.includes('AuthGuard'),'Search finds password tool');$('project-search').value='not-a-real-project-xyz';$('project-search').dispatchEvent(new w.Event('input'));check(!$('empty-results').hidden&&$('project-results').children.length===0,'No-result empty state');$('project-search').value='';$('project-search').dispatchEvent(new w.Event('input'));$('project-search').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true,cancelable:true}));check($('project-results').querySelector('[aria-current=true]').textContent.includes('SentrySim'),'Arrow key changes highlighted destination');$('close-explorer').click();await wait(()=>!$('explorer').open&&d.activeElement===opener);check(!$('explorer').open&&d.activeElement===opener,'Close restores opener focus');d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'k',ctrlKey:true,bubbles:true,cancelable:true}));check($('explorer').open,'Ctrl+K opens explorer');$('close-explorer').click();
frame.style.width='390px';await wait(()=>w.innerWidth===390);check(d.documentElement.scrollWidth<=w.innerWidth,'No horizontal page overflow at 390px');check(w.getComputedStyle(d.querySelector('.hero-grid')).gridTemplateColumns.split(' ').length===1,'Mobile hero is one column');const menu=d.querySelector('.mobile-nav');check(w.getComputedStyle(menu).display!=='none','Mobile menu available');menu.open=true;menu.querySelector('a').click();check(!menu.open,'Mobile navigation closes after selection');frame.style.width='768px';await wait(()=>w.innerWidth===768);check(d.documentElement.scrollWidth<=w.innerWidth,'No horizontal overflow at tablet width');frame.style.width='1280px';await wait(()=>w.innerWidth===1280);check(d.documentElement.scrollWidth<=w.innerWidth,'No horizontal overflow at desktop width');check(d.querySelector('link[rel=stylesheet]').sheet.cssRules.length>0,'Stylesheet loaded');check(!d.querySelector('input[type=password]'),'Homepage does not invent a login or collect credentials');out.textContent+='COMPLETE: '+count+' prototype checks passed. Physical microphone, paid providers and full migration regressions are pending.';}catch(error){out.textContent+='FAIL '+error.message;}};
</script></html>
