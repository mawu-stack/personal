<!doctype html><html lang="en"><meta charset="utf-8"><title>Gateway reduced-motion QA</title><h1>Reduced-motion fixture</h1><p>Forces the motion preference in an isolated page and activates its existing reduced-motion CSS rules. This is not an OS/device test.</p><pre id="out">Running…</pre><iframe id="app" title="Reduced-motion gateway" style="width:1100px;height:800px"></iframe><script>
(async()=>{const out=document.getElementById('out'),f=document.getElementById('app');let count=0;const pause=ms=>new Promise(r=>setTimeout(r,ms)),check=(ok,msg)=>{if(!ok)throw Error(msg);out.textContent+='PASS '+msg+'\n';count++;};try{out.textContent='';const html=await(await fetch('workbench.html')).text(),patch='<base href="/personal/kean-v2/"><script>const nativeMedia=window.matchMedia.bind(window);window.matchMedia=q=>{if(!q.includes("prefers-reduced-motion"))return nativeMedia(q);const events=new EventTarget();return{matches:true,media:q,addEventListener:events.addEventListener.bind(events),removeEventListener:events.removeEventListener.bind(events)};};window.motionCalls=0;const nativeAnimate=Element.prototype.animate;Element.prototype.animate=function(...args){window.motionCalls++;return nativeAnimate.apply(this,args);};<'+ '/script>';const loaded=new Promise(r=>f.onload=r);f.srcdoc=html.replace('<head>','<head>'+patch);await loaded;await pause(1000);const w=f.contentWindow,d=f.contentDocument;let rules=0;function force(list){for(const rule of list){if(rule.media?.mediaText.includes('prefers-reduced-motion: reduce')){rule.media.mediaText='all';rules++;}if(rule.cssRules)force(rule.cssRules);}}for(const sheet of d.styleSheets){try{force(sheet.cssRules);}catch{}}
check(rules>=2,'Existing workbench and gateway reduced-motion rules found');check(w.getComputedStyle(d.querySelector('.sim-login-card')).animationName==='none','Gateway entrance animation disabled');check(w.getComputedStyle(d.getElementById('sim-login-username')).transitionDuration==='0s','Input transition disabled');w.speechSynthesis.speak=()=>{};d.getElementById('sim-login-username').value='student';d.getElementById('sim-login-password').value='StudentDemo!2026';await w.handleSimulatedLoginSubmit();await pause(450);d.getElementById('tab-btn-5').click();await pause(100);check(d.getElementById('panel-tab-5').classList.contains('active'),'Navigation works with reduced motion');check(w.motionCalls===0,'No Web Animations requested by shell/transition adapters');out.textContent+='COMPLETE: '+count+' checks passed under forced reduced-motion fixture.';}catch(e){out.textContent+='FAIL '+e.message;}})();
</script></html>
