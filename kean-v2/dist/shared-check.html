<!doctype html><html lang="en"><meta charset="utf-8"><title>Shared workbench QA</title><h1>Shared workbench QA</h1><pre id="out">Running…</pre><iframe id="app" title="Workbench under test" src="workbench.html#tab-5" style="width:1200px;height:800px"></iframe><script>
const f=document.getElementById('app'),out=document.getElementById('out');let pass=0,fail=0;function check(ok,msg){ok?pass++:fail++;out.textContent+=(ok?'PASS ':'FAIL ')+msg+'\n';}const pause=ms=>new Promise(r=>setTimeout(r,ms));const wait=async fn=>{const end=Date.now()+5000;while(!fn()&&Date.now()<end)await pause(40);};
f.onload=async()=>{out.textContent='';const w=f.contentWindow,d=f.contentDocument;try{await pause(1300);w.speechSynthesis.speak=()=>{};d.getElementById('sim-login-username').value='student';d.getElementById('sim-login-password').value='StudentDemo!2026';await w.handleSimulatedLoginSubmit();await pause(800);check(w.getComputedStyle(d.getElementById('simulated-login-overlay')).display==='none','Public demo sign-in still works');
check(d.querySelectorAll('link[href="workbench.css"]').length===1&&!d.querySelector('link[href="integration.css"]'),'One shared stylesheet; retired overrides not loaded');
check(d.querySelectorAll('style').length===0,'All 15 legacy style blocks externalized');check(d.querySelectorAll('.v2-sidebar .tab-btn').length===9,'All nine original controls reused in sidebar');
check(w.getComputedStyle(d.querySelector('.arch-node')).borderRadius==='4px','New node shape wins over legacy selectors');check(w.getComputedStyle(d.querySelector('.arch-node')).backgroundColor!=='rgb(30, 41, 59)','Legacy blue node background resolved');
let errors=[];w.addEventListener('error',e=>errors.push(e.message));
for(const width of [390,768,1200]){f.style.width=width+'px';await pause(150);for(let i=1;i<=9;i++){w.switchTab('tab-'+i);await wait(()=>d.getElementById('panel-tab-'+i).classList.contains('active'));await pause(300);await wait(()=>d.documentElement.scrollWidth<=w.innerWidth+1);const fits=d.documentElement.scrollWidth<=w.innerWidth+1;check(fits,width+'px Tab '+i+' has no page overflow');if(!fits){const bad=[...d.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.right>w.innerWidth+2}).filter(e=>!e.closest('.tabs-nav-bar')).slice(0,10).map(e=>e.tagName+'.'+e.className);out.textContent+='  width '+d.documentElement.scrollWidth+'/'+w.innerWidth+' scrollX '+w.scrollX+' overflow candidates: '+bad.join(', ')+'\n';}}}
f.style.width='1200px';await pause(150);w.switchTab('tab-5');await wait(()=>d.getElementById('panel-tab-5').classList.contains('active'));const tab=d.getElementById('tab-btn-5');tab.focus();tab.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));await wait(()=>d.getElementById('panel-tab-6').classList.contains('active'));out.textContent+='  focused '+d.activeElement.id+' active '+d.querySelector('.tab-panel.active')?.id+'\n';check(d.getElementById('panel-tab-6').classList.contains('active'),'Desktop vertical arrow selects next original tab');
d.getElementById('theme-btn-light').click();await pause(500);check(w.getComputedStyle(d.body).backgroundColor==='rgb(244, 243, 238)','Light canvas uses shared theme (actual '+w.getComputedStyle(d.body).backgroundColor+'; '+d.body.className+')');d.getElementById('theme-btn-dark').click();await pause(500);check(w.getComputedStyle(d.body).backgroundColor==='rgb(11, 12, 16)','Dark canvas uses homepage color (actual '+w.getComputedStyle(d.body).backgroundColor+'; '+d.body.className+')');
w.switchTab('tab-3');d.querySelector('.ai-threat-node').click();check(d.getElementById('injection-input').value.length>15,'AI threat node fills existing prompt');d.getElementById('btn-open-connect-ai').click();check(w.getComputedStyle(d.getElementById('ai-connect-modal')).display!=='none','Existing Connect AI opens');d.getElementById('btn-close-ai-modal').click();
w.switchTab('tab-4');const rows=d.querySelectorAll('#stride-table-body tr').length;const filter=d.getElementById('stride-tier-filter');filter.value='Tier 1';filter.dispatchEvent(new w.Event('change'));check(d.querySelectorAll('#stride-table-body tr').length<rows,'STRIDE tier filter updates original matrix');
w.switchTab('tab-1');await wait(()=>d.getElementById('panel-tab-1').classList.contains('active'));w.switchTab('tab-5');await wait(()=>d.getElementById('panel-tab-5').classList.contains('active'));w.history.back();await wait(()=>d.getElementById('panel-tab-1').classList.contains('active'));check(d.getElementById('panel-tab-1').classList.contains('active'),'Browser back restores preceding lab');w.history.forward();await wait(()=>d.getElementById('panel-tab-5').classList.contains('active'));check(d.getElementById('panel-tab-5').classList.contains('active'),'Browser forward restores architecture');
check(errors.length===0,'No runtime errors during exercised interactions');out.textContent+='COMPLETE: '+pass+' passed, '+fail+' failed. No paid AI or physical voice test.';
}catch(e){check(false,e.message);}};
</script></html>
