const f=document.getElementById('app'),out=document.getElementById('out'),pause=ms=>new Promise(r=>setTimeout(r,ms));let count=0;const check=(ok,msg)=>{if(!ok)throw Error(msg);count++;out.textContent+='PASS '+msg+'\n';},wait=async(fn,ms=10000)=>{const end=Date.now()+ms;while(!fn()){if(Date.now()>end)throw Error('Timed out waiting for UI');await pause(35);}};
f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument,$=id=>d.getElementById(id),errors=[];w.addEventListener('error',e=>errors.push(e.message));try{out.textContent='';await wait(()=>w.SentryWorkbench&&$('ss-graph').cytoscape&&w.sentryState);w.speechSynthesis.speak=()=>{};let alerts=0;w.alert=()=>alerts++;$('sim-login-username').value='student';$('sim-login-password').value='StudentDemo!2026';await w.handleSimulatedLoginSubmit();await wait(()=>!$('workbench-content').inert);const cy=$('ss-graph').cytoscape,api=w.SentryWorkbench;check(w.cytoscape.version==='3.34.4','Existing pinned graph engine reused');check(cy.nodes('[tier]').length===5,'Five actual graph tiers');check(cy.edges().length===5,'Application and optional AI connections');check($('ss-attack').options.length===8,'All eight scenario choices retained');

check(alerts===0,'Unsafe XSS markup stays inert in upgraded replay');
for(let tier=1;tier<=5;tier++){cy.$id('ss-t'+tier).emit('tap');check($('sentry-workspace').dataset.selectedTier===String(tier),'Tier '+tier+' graph selection works');}cy.$id('ss-e12').emit('tap');check($('ss-inspector').textContent.includes('TLS ingress'),'Connection inspection works');
const find=text=>[...$('sentry-workspace').querySelectorAll('button')].find(b=>b.textContent===text);$('ss-attack').value='1';$('toggle-waf').checked=false;$('toggle-waf').dispatchEvent(new w.Event('change'));$('toggle-ratelimit').checked=false;$('toggle-ratelimit').dispatchEvent(new w.Event('change'));await api.run(false);check(api.snapshot().index===0,'Step starts at first tier');find('Step').click();check(api.snapshot().index===1,'Step advances one tier');find('Resume').click();check(api.snapshot().playing,'Resume starts playback');find('Pause').click();const frozen=api.snapshot().index;await pause(1100);check(api.snapshot().index===frozen&&!api.snapshot().playing,'Pause freezes illustrative playback');find('Resume').click();await wait(()=>$('sentry-workspace').dataset.finished==='true');check($('ss-status').textContent.includes('COMPROMISED')&&cy.$id('ss-t5').hasClass('ss-compromised'),'Exposed playback reaches actual vault outcome');api.reset();check($('ss-timeline').children.length===0&&cy.edges('.ss-traversed').length===0&&$('sentry-workspace').dataset.step==='0','Reset clears playback, graph and timeline');
$('toggle-ratelimit').checked=true;$('toggle-ratelimit').dispatchEvent(new w.Event('change'));await api.run(false);find('Step').click();check($('ss-status').textContent.includes('BLOCKED')&&cy.$id('ss-t2').hasClass('ss-blocked'),'Blocked playback stops at ingress tier');check($('ss-timeline').textContent.includes('Attack [Vector 1:'),'Timeline includes genuine simulator event');
let z=cy.zoom();find('Zoom +').click();check(cy.zoom()>z,'Zoom control operates on graph');find('Zoom −').click();check(Math.abs(cy.zoom()-z)<1e-5,'Zoom out reverses zoom');let x=cy.pan().x;find('Pan ←').click();check(cy.pan().x>x,'Pan changes graph viewport');find('Fit / reset view').click();$('ss-tier').value='4';$('ss-tier').dispatchEvent(new w.Event('change'));check($('ss-inspector').textContent.includes('do not target'),'AI tier honestly marked untested by eight vectors');$('ss-graph').focus();$('ss-graph').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}));check($('ss-tier').value==='5','Keyboard selects next tier');
for(const width of [1440,1024,768,390]){f.style.width=width+'px';await pause(180);find('Fit / reset view').click();check(d.documentElement.scrollWidth<=w.innerWidth+2,width+'px has no horizontal page overflow');const b=cy.elements().not('#ss-packet').renderedBoundingBox(),r=$('ss-graph').getBoundingClientRect();check(cy.$id('ss-packet').position().x===cy.$id('ss-t2').position().x&&cy.$id('ss-packet').position().y===cy.$id('ss-t2').position().y,width+'px packet stays at recorded tier after resize');check(b.x1>=-2&&b.y1>=-2&&b.x2<=r.width+2&&b.y2<=r.height+2,width+'px full topology fits');}

</script></html>
