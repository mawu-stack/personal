<!doctype html><html lang="en"><meta charset="utf-8"><title>Gateway visibility regression</title><h1>Gateway visibility regression</h1><pre id="out">Running…</pre><iframe id="app" title="Gateway regression application" src="workbench.html#tab-5" style="width:1200px;height:800px"></iframe><script>
const frame=document.getElementById('app'),out=document.getElementById('out');let count=0;const pause=ms=>new Promise(r=>setTimeout(r,ms)),wait=async(fn,ms=7000)=>{const end=Date.now()+ms;while(!fn()){if(Date.now()>end)throw Error('Timed out waiting for state');await pause(20);}},check=(ok,msg)=>{if(!ok)throw Error(msg);count++;out.textContent+='PASS '+msg+'\n';};
frame.onload=async()=>{out.textContent='';const w=frame.contentWindow,d=frame.contentDocument,$=id=>d.getElementById(id),gate=$('simulated-login-overlay'),main=$('workbench-content');try{await wait(()=>$('gateway-disclaimer'));w.speechSynthesis.speak=()=>{};await wait(()=>main.inert);const visible=()=>!gate.hidden&&!gate.classList.contains('hidden')&&w.getComputedStyle(gate).display!=='none'&&w.getComputedStyle(gate).visibility==='visible'&&Number(w.getComputedStyle(gate).opacity)>0;
const styles=[...d.querySelectorAll('link[rel=stylesheet]')].map(x=>x.getAttribute('href'));check(styles.indexOf('legacy-compat.css')<styles.indexOf('workbench.css')&&styles.indexOf('workbench.css')<styles.indexOf('gateway.css'),'CSS order: compatibility, shared system, gateway');const sheet=[...d.styleSheets].find(s=>s.href?.endsWith('legacy-compat.css'));check(sheet.cssRules.length===1&&sheet.cssRules[0].name==='legacy','Every compatibility rule is contained in @layer legacy');
for(const [name,hide,show]of [['hidden class',()=>gate.classList.add('hidden'),()=>gate.classList.remove('hidden')],['visibility',()=>gate.style.visibility='hidden',()=>gate.style.removeProperty('visibility')],['opacity',()=>gate.style.opacity='0',()=>gate.style.removeProperty('opacity')],['hidden attribute',()=>gate.hidden=true,()=>gate.hidden=false],['display',()=>gate.style.display='none',()=>gate.style.display='flex']]){hide();await wait(()=>!main.inert);check(gate.inert&&w.getComputedStyle(gate).pointerEvents==='none',name+' releases workbench and disables invisible overlay');show();await wait(()=>visible()&&main.inert);check(!gate.inert,name+' reopens focus boundary');}
const dynamic=d.createElement('button');dynamic.textContent='Temporary background control';d.body.append(dynamic);await wait(()=>dynamic.inert);check(true,'Dynamically added background controls become inert');
async function login(){ $('sim-login-username').value='student';$('sim-login-password').value='StudentDemo!2026';await w.handleSimulatedLoginSubmit(); }
await login();check(gate.classList.contains('hidden')&&gate.style.display!=='none','Controller starts with hidden class before delayed display update');check(!main.inert&&!dynamic.inert&&!d.body.classList.contains('v2-gateway-open'),'Session start clears gateway-owned inert immediately');check(!gate.contains(d.activeElement),'Keyboard focus restored before delayed display update');check([...d.body.children].filter(e=>e!==gate&&!['SCRIPT','STYLE','LINK'].includes(e.tagName)).every(e=>!e.inert),'All normal background siblings restored');
$('v2-logout').click();await pause(500);check(visible()&&main.inert&&!w.currentSessionToken,'Rapid logout remains visible after stale login timer');
for(let i=1;i<=4;i++){await login();await wait(()=>w.getComputedStyle(gate).display==='none');check(!main.inert&&w.currentSession.role==='user','Login cycle '+i+' restores workbench');$('tab-btn-'+i).click();await wait(()=>$('panel-tab-'+i).classList.contains('active'));check(w.location.hash==='#tab-'+i,'Cycle '+i+' navigation works');$('v2-logout').click();await wait(()=>visible()&&main.inert);check(!w.currentSessionToken,'Logout cycle '+i+' revokes session and traps focus');}
await login();await wait(()=>w.getComputedStyle(gate).display==='none');w.__simulateSessionElapsed(1200);await wait(()=>visible()&&main.inert);check(!w.currentSession&&!w.A4Auth.session,'Original expiration helper revokes session and reopens gateway');await login();await wait(()=>w.getComputedStyle(gate).display==='none');check(!main.inert,'Sign-in after expiration restores interaction');
const target=$('a4-end-session'),parent=target.parentNode;target.remove();let errors=[];w.addEventListener('error',event=>errors.push(event.message));$('v2-logout').click();check($('v2-logout').disabled&&errors.length===0,'Missing original logout control disables alias without throwing');parent.append(target);dynamic.remove();check(errors.length===0,'No runtime errors in exercised lifecycle states');out.textContent+='COMPLETE: '+count+' checks passed. Expiration uses the original helper, not a 20-minute wall-clock wait.';
}catch(e){out.textContent+='FAIL '+e.message;}};
</script></html>
