<!doctype html><html lang="en"><meta charset="utf-8"><title>Research platform QA</title><h1>Research platform QA</h1><pre id="out">Running…</pre><iframe id="app" title="Research platform under test" src="workbench.html#tab-2" style="width:1440px;height:900px"></iframe><script>
const f=document.getElementById('app'),out=document.getElementById('out'),pause=ms=>new Promise(r=>setTimeout(r,ms));let count=0;const check=(ok,label)=>{if(!ok)throw Error(label);out.textContent+='PASS '+label+'\n';count++;},wait=async fn=>{const end=Date.now()+9000;while(!fn()){if(Date.now()>end)throw Error('Timeout');await pause(30);}};
f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument,$=id=>d.getElementById(id),errors=[];w.addEventListener('error',e=>errors.push(e.message));try{out.textContent='';await wait(()=>$('research-vector'));w.speechSynthesis.speak=()=>{};$('sim-login-username').value='student';$('sim-login-password').value='StudentDemo!2026';await w.handleSimulatedLoginSubmit();await wait(()=>!$('workbench-content').inert);check(true,'Original demo sign-in releases workbench');check(d.querySelectorAll('.research-guide').length===9,'All nine labs have field guides');
for(const width of [1440,1024,768,390]){f.style.width=width+'px';await pause(100);for(let i=1;i<=9;i++){w.switchTab('tab-'+i);await pause(35);check(d.documentElement.scrollWidth<=w.innerWidth+2,width+'px lab '+i+' has no page overflow');if(i===2)check([...d.querySelectorAll('.tier-card')].every(c=>c.getBoundingClientRect().width>=110&&c.getBoundingClientRect().height<600),width+'px Sentry nodes remain readable, not narrow strips');}check(d.querySelector('.tabs-nav-bar').getAttribute('aria-orientation')===(width>850?'vertical':'horizontal'),width+'px navigation orientation matches CSS breakpoint');}
f.style.width='1440px';w.switchTab('tab-2');const inspector=$('sentry-component-inspector');for(let i=1;i<=5;i++){$('tier-'+i+'-card').querySelector('.research-button').click();check(inspector.querySelector('h4').textContent===$('tier-'+i+'-card').querySelector('h4').textContent,'Tier '+i+' inspector uses original component text');}check($('research-vector').options.length===8,'All eight original vector actions available');const tools=d.querySelector('.research-topology-tools'),buttons=[...tools.querySelectorAll('button')];buttons.find(b=>b.textContent==='Reset walkthrough').click();check($('tier-1-card').classList.contains('research-selected'),'Sentry walkthrough reset');buttons.find(b=>b.textContent==='Next boundary').click();check($('tier-2-card').classList.contains('research-selected'),'Sentry next boundary');buttons.find(b=>b.textContent==='Previous boundary').click();check($('tier-1-card').classList.contains('research-selected'),'Sentry previous boundary');buttons.find(b=>b.textContent==='Play walkthrough').click();await pause(1350);check($('tier-2-card').classList.contains('research-selected'),'Playback advances illustrative path');w.switchTab('tab-5');await pause(30);check(buttons.some(b=>b.textContent==='Play walkthrough'),'Leaving lab cancels playback');
check(d.querySelectorAll('.arch-node').length===9,'Nine proposed architecture components retained');const toolbar=d.querySelector('.arch-toolbar'),play=[...toolbar.querySelectorAll('button')].find(b=>b.textContent==='Play request');play.click();await pause(1650);check(d.querySelector('.arch-progress').textContent.includes('1 of 4'),'Architecture playback reuses original request step');toolbar.querySelectorAll('button')[1].click();check(play.textContent==='Play request','Architecture reset stops playback');
w.switchTab('tab-7');for(const name of Object.keys(w.DDoSGuard.results.models)){$('research-model').value=name;$('research-model').dispatchEvent(new w.Event('change'));const cells=[...d.querySelectorAll('.research-confusion button')],m=w.DDoSGuard.results.models[name];check(cells.map(b=>Number(b.querySelector('strong').textContent.replaceAll(',',''))).join()===m.confusion.flat().join(),name+' error cells equal actual experiment');cells[2].click();check($('research-error-detail').textContent.includes(m.confusion[1][0].toLocaleString())&&$('research-error-detail').textContent.includes('blind spots'),name+' missed attack explanation');}check($('research-movie').textContent.includes('not been supplied'),'Movie honestly marked missing');check(!d.querySelector('#research-movie video'),'No fabricated movie/player');check($('dg-roc').querySelector('svg')&&$('dg-model-table').children.length===2,'Original measured charts/table preserved');
w.switchTab('tab-1');$('pwd-input').value='correct-horse-battery-staple';$('pwd-input').dispatchEvent(new w.Event('input',{bubbles:true}));await pause(650);check($('research-resistance').textContent.includes($('real-entropy-bits').textContent),'Credential summary reads original engine');w.switchTab('tab-4');$('research-stride-category').selectedIndex=5;$('research-stride-category').dispatchEvent(new w.Event('change'));check(d.querySelector('#panel-tab-4 .research-resistance').textContent.includes('authorization'),'STRIDE inspector changes explanation');check(d.querySelectorAll('.research-archive button').length>0,'Coursework original section links available');
w.switchTab('overview');await pause(30);check(!$('research-overview').hidden,'Single overview lead visible');check(w.getComputedStyle(d.querySelector('.wb-hero')).display==='none','Competing legacy overview hero suppressed');$('research-overview').querySelector('a').click();await wait(()=>w.location.hash==='#tab-2'&&$('research-overview').hidden);check(w.location.hash==='#tab-2'&&$('research-overview').hidden,'Overview project link uses original routing');
for(const theme of ['light','dark','auto']){$('theme-btn-'+theme).click();check(true,'Existing '+theme+' theme control exercised');}const ids=[...d.querySelectorAll('[id]')].map(e=>e.id);check(ids.length===new Set(ids).size,'No duplicate IDs');check(errors.length===0,'No errors during new interactions');out.textContent+='COMPLETE: '+count+' checks passed. Local simulations/artifacts only. No provider key, microphone or movie supplied.';
}catch(e){out.textContent+='FAIL '+e.message;}};
</script></html>
