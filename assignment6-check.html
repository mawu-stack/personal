<!doctype html><html lang="en"><meta charset="utf-8"><title>Assignment 6 checks</title><style>body{font:16px system-ui;background:#101a29;color:#e8f0ff;padding:24px}button{padding:12px}pre{white-space:pre-wrap}iframe{width:100%;height:550px}</style><h1>Assignment 6 browser verification</h1><p>Tests run on the actual local workbench. No external provider or URL scanner request is required.</p><button id="run">Run checks</button><pre id="out" role="status">Not run.</pre><iframe id="site" src="/index-cmdk.html#tab-9"></iframe><script>
const frame=document.getElementById('site'),out=document.getElementById('out');
document.getElementById('run').onclick=async()=>{out.textContent='Running…\n';let count=0;const assert=(v,m)=>{if(!v)throw Error(m);count++;out.textContent+='PASS '+m+'\n';};const wait=async f=>{const end=performance.now()+8000;while(!f()){if(performance.now()>end)throw Error('Timed out');await new Promise(r=>setTimeout(r,40));}};
try{const w=frame.contentWindow,d=w.document,$=id=>d.getElementById(id);await wait(()=>w.Assignment6&&w.A4Auth&&w.Assignment4);w.speechSynthesis.speak=()=>{};
$('sim-login-username').value='student';$('sim-login-password').value='StudentDemo!2026';await w.handleSimulatedLoginSubmit();await wait(()=>getComputedStyle($('simulated-login-overlay')).display==='none');
assert($('panel-tab-9').classList.contains('active'),'Tab 9 opens through URL hash');
const controls=w.Assignment6.runTests();assert(controls.passed===10&&controls.failed===0,'Ten actual text-rendering/validation/encoding checks pass');
const payload='<svg onload="window.__a6Executed=true">hello</svg>';$('a6-input').value=payload;$('a6-render').click();assert($('a6-safe-output').textContent===payload&&$('a6-safe-output').children.length===0,'User input is literal text, with no parsed elements');assert($('a6-encoded-output').textContent.startsWith('&lt;svg'),'Encoded source uses HTML text encoding');assert(!w.__a6Executed,'No payload marker executes');
$('a6-input').value='x'.repeat(2001);$('a6-render').click();assert($('a6-safe-output').textContent===''&&$('a6-input-status').textContent.includes('1–2,000'),'Application rejects programmatically oversized input');
const beforeGuard=$('toggle-llm-guard').checked;for(const guard of [true,false]){$('toggle-llm-guard').checked=guard;$('injection-input').value=payload;w.sentryTestPromptInjection();assert($('injection-sandbox-display').textContent.includes(payload)&&!$('injection-sandbox-display').querySelector('svg')&&!w.__a6Executed,'Corrected local AI sink stays inert with prompt guard '+(guard?'on':'off'));}$('toggle-llm-guard').checked=beforeGuard;
assert($('a6-markup-demo').getAttribute('sandbox')===''&&!$('a6-markup-demo').srcdoc.includes(payload),'Fixed parsing demo is sandboxed and never receives user input');
const r=JSON.parse($('a6-results-json').textContent);assert(r.test&&$('a6-metric-rows').rows.length===4,'Four measured methods populate results table');const hybrid=[...$('a6-metric-rows').rows].find(row=>row.cells[0].textContent==='Selected hybrid');assert(hybrid.cells[4].textContent===(r.test.hybrid.f1*100).toFixed(2)+'%','Displayed hybrid F1 matches real JSON');assert($('a6-split-summary').textContent.includes('101,978'),'Actual historical test size shown');assert($('a6-validation').textContent.includes('0.5'),'Validation-selected weight shown');
const report=JSON.parse($('a6-report-json').textContent);assert(report.includes('11,364')&&report.includes('4,922')&&report.includes('exploratory'),'Embedded write-up contains measured results and evaluation caveat');
let download=null;const original=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){download={name:this.download,href:this.href};};try{$('a6-download-report').click();assert(download.name==='assignment6-submission.md'&&download.href.startsWith('blob:'),'Write-up download produces local Markdown blob');$('a6-download-results').click();assert(download.name==='assignment6-results.json','Result download produces measured JSON');}finally{w.HTMLAnchorElement.prototype.click=original;}
w.routeCommand('open xss lab');await wait(()=>$('panel-tab-9').classList.contains('active'));assert($('panel-tab-9').classList.contains('active'),'Shared voice/palette alias opens Assignment 6');
for(let i=1;i<=8;i++){w.switchTab('tab-'+i);await wait(()=>$('panel-tab-'+i).classList.contains('active'));assert($('panel-tab-'+i).classList.contains('active'),'Existing tab '+i+' remains accessible');}
w.routeCommand('show security logs');assert($('a4-decision').textContent.includes('Authorized: no'),'Assignment 4 authorization still denies student');
assert(typeof w.SecurityState==='object'&&typeof w.routeCommand==='function','SecurityState and shared command router remain available');
w.switchTab('tab-9');await wait(()=>$('panel-tab-9').classList.contains('active'));frame.style.width='390px';await wait(()=>w.innerWidth<=400);assert(w.getComputedStyle(d.querySelector('.a6-grid')).gridTemplateColumns.split(' ').length===1,'Assignment 6 cards use one column at mobile width');assert($('panel-tab-9').getBoundingClientRect().width<=w.innerWidth,'Assignment 6 panel fits the mobile viewport');frame.style.width='100%';
out.textContent+='COMPLETE: '+count+' browser checks passed, plus 10 renderer subchecks. Physical microphone and paid providers not exercised.\n';
}catch(e){out.textContent+='FAIL '+e.message+'\n';console.error(e);}};
</script></html>
