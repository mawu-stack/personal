<!doctype html><html lang="en"><meta charset="utf-8"><title>PhishGuard integration checks</title><style>body{font:16px system-ui;background:#102030;color:white;padding:24px}pre{white-space:pre-wrap}iframe{width:100%;height:450px}</style><h1>PhishGuard verification</h1><button id="run">Run checks</button><pre id="results">Ready</pre><iframe id="site" src="/index-cmdk.html#tab-7" title="App under test"></iframe><script>
document.getElementById('run').onclick=async()=>{const out=document.getElementById('results'),w=document.getElementById('site').contentWindow,d=w.document,$=id=>d.getElementById(id);out.textContent='';let n=0;const check=(name,ok)=>{out.textContent+=(ok?'PASS ':'FAIL ')+name+'\n';if(!ok)throw Error(name);n++;};const wait=async f=>{const until=Date.now()+7000;while(!f()){if(Date.now()>until)throw Error('Timed out');await new Promise(r=>setTimeout(r,30));}};try{await wait(()=>w.routeCommand&&$('pg-performance').children.length===2);w.speechSynthesis.speak=u=>queueMicrotask(()=>u.onend?.());$('sim-login-username').value='demo';$('sim-login-password').value='demo';$('btn-sim-login-submit').click();await wait(()=>w.getComputedStyle($('simulated-login-overlay')).display==='none');check('Existing login and role',w.Assignment4.valid());check('Direct Tab 7 hash',$('panel-tab-7').classList.contains('active'));check('Real source stats',$('pg-stats').textContent.includes('11,055'));check('Two model rows',$('pg-performance').children.length===2);const data=JSON.parse($('phishguard-results').textContent);check('URL results match export',$('pg-performance').textContent.includes((data.experiments.url.models['Random Forest'].accuracy*100).toFixed(1)+'%'));$('pg-experiment').value='full';$('pg-experiment').dispatchEvent(new w.Event('change'));check('Full-feature switch matches export',$('pg-performance').textContent.includes((data.experiments.full.models['Random Forest'].accuracy*100).toFixed(1)+'%'));check('Confusion matrices', $('pg-confusions').querySelectorAll('table').length===2);check('ROC curves',$('pg-roc').querySelectorAll('path').length===4);check('Heatmap generated',$('pg-correlation').querySelectorAll('td').length===900);$('pg-feature').value='SSLfinal_State';$('pg-feature').dispatchEvent(new w.Event('change'));check('Feature explorer',$('pg-feature-description').textContent.includes('certificate'));$('pg-record-filter').value='error';$('pg-record-filter').dispatchEvent(new w.Event('change'));check('Held-out error filter',$('pg-record').options.length>0);const record=data.experiments.full.records.find(r=>String(r.id)===$('pg-record').value);check('Error example really misclassified',Object.values(record.predictions).some(p=>p.label!==record.actual));let network=0;w.fetch=()=>{network++;throw Error('Unexpected network call');};const submit=text=>{$('pg-url').value=text;$('pg-url-form').dispatchEvent(new w.Event('submit',{cancelable:true}));};submit('https://example.com/account');check('URL parsed without verdict',$('pg-url-result').textContent.includes('NOT A SAFETY VERDICT'));submit('javascript:alert(1)');check('Reject executable scheme',$('pg-url-result').textContent.includes('Only complete'));submit('<img src=x onerror=alert(1)>');check('Markup safely rejected',!$('pg-url-result').querySelector('img'));check('No URL network requests',network===0);await w.routeCommand('open phishguard');check('Shared voice/palette route',$('panel-tab-7').classList.contains('active'));for(let i=1;i<=6;i++){$('tab-btn-'+i).click();await wait(()=>$('panel-tab-'+i).classList.contains('active'));check('Preserved tab '+i,$('panel-tab-'+i).classList.contains('active'));}$('tab-btn-7').click();d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'k',ctrlKey:true,bubbles:true}));check('Ctrl+K preserved',$('cmdk-dialog').open);$('cmdk-dialog').close();$('theme-btn-light').click();await wait(()=>d.body.classList.contains('wb-light'));check('Light theme inherited',d.body.classList.contains('wb-light'));$('theme-btn-dark').click();await wait(()=>!d.body.classList.contains('wb-light'));check('Dark theme inherited',!d.body.classList.contains('wb-light'));check('Final presentation marked Planned',$('pg-timeline').lastElementChild.textContent.includes('PLANNED'));let downloaded=false;const original=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){if(this.download==='phishguard-results.json')downloaded=true;else original.call(this);};$('pg-download').click();check('Results download created',downloaded);out.textContent+='COMPLETE: '+n+' checks passed. No live API or microphone testing.';}catch(e){out.textContent+='FAILED: '+e.message;}};
</script><button id="pending-test">Test missing-results state</button><script>
document.getElementById('pending-test').onclick=async()=>{const f=document.getElementById('site'),o=document.getElementById('results');try{const h=await(await fetch('/index-cmdk.html')).text();const ready=new Promise(r=>f.onload=r);f.srcdoc=h.replace(/(<script type="application\/json" id="phishguard-results">)[\s\S]*?(<\/script>)/,'$1{"status":"pending"}$2');await ready;const d=f.contentDocument;if(d.getElementById('pg-status').textContent!=='Awaiting Model Results'||!d.getElementById('pg-experiment').disabled||d.getElementById('pg-stats').textContent.includes('11,055'))throw Error('Pending state invalid');o.textContent+='\nPASS Missing-results state: no fake stats; result controls disabled.';}catch(e){o.textContent+='\nFAIL Missing-results state: '+e.message;}};
</script></html>
